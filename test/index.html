<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מעקב כושר (בדיקה)</title>
<meta name="theme-color" content="#7c3aed">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="כושר בדיקה">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="../icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Look: fresh and playful. A violet-to-pink hero with a progress ring, soft floating cards, pill buttons and a floating tab bar. Phone first, right to left. */
:root{
  --bg:#f5f3fc; --surface:#ffffff; --surface-2:#f0edfa; --ink:#1c1733; --muted:#6c6787; --line:#e6e2f3;
  --accent:#6a4cf6; --accent-2:#e3509d; --accent-soft:#ece7ff; --accent-ink:#ffffff;
  --hero-a:#6a4cf6; --hero-b:#b54ad8; --hero-c:#ec5c95;
  --deficit:#10a37f; --surplus:#f06a3d; --danger:#d93a4a;
  --protein:#4f7cff; --carbs:#f2a516; --fat:#ef5b9c; --fiber:#2fb36b;
  --shadow:0 6px 22px rgba(60,35,140,.08), 0 1px 3px rgba(60,35,140,.06);
  --font-display:"Rubik", "Assistant", system-ui, sans-serif;
  --font-body:"Assistant", "Rubik", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --r:22px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#100d1b; --surface:#1b1729; --surface-2:#242036; --ink:#efecfa; --muted:#a39fbb; --line:#2e2943;
    --accent:#9b85ff; --accent-2:#f27ab5; --accent-soft:#2a2350; --accent-ink:#130f22;
    --hero-a:#5137d6; --hero-b:#8d36b4; --hero-c:#c2406f;
    --deficit:#3fd0a4; --surplus:#ff8c62; --danger:#ff7b86;
    --protein:#86a5ff; --carbs:#ffc24d; --fat:#ff8dbd; --fiber:#62d48f;
    --shadow:0 6px 22px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.45 var(--font-body);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.5rem;font-weight:800}
h3{font-size:1.05rem;font-weight:700}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.86rem}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:16px 18px 6px}
header.top h1{font-size:1.2rem;font-weight:800;display:flex;align-items:center;gap:9px}
.logo{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,var(--hero-a),var(--hero-c));display:inline-grid;place-items:center;color:#fff;font-size:.95rem;box-shadow:0 4px 12px color-mix(in srgb,var(--hero-b) 40%,transparent)}
.store-pill{font-size:.76rem;padding:4px 10px;border-radius:99px;background:var(--surface);color:var(--muted);display:inline-flex;gap:6px;align-items:center;box-shadow:var(--shadow)}
.store-pill i{width:7px;height:7px;border-radius:50%;background:var(--deficit);display:inline-block}
.store-pill.local i{background:var(--surplus)}
main{flex:1;padding:6px 16px 118px;display:flex;flex-direction:column;gap:14px}

nav.tabs{position:fixed;left:12px;right:12px;bottom:12px;display:flex;justify-content:center;z-index:5;pointer-events:none}
nav.tabs .inner{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;width:100%;max-width:536px;pointer-events:auto;background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:24px;box-shadow:0 10px 30px rgba(40,20,100,.16);padding:6px;border:1px solid var(--line)}
nav.tabs button{background:none;border:0;padding:7px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74rem;color:var(--muted);cursor:pointer;border-radius:18px;transition:background .2s,color .2s}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700;background:var(--accent-soft)}

.card{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:10px}
.grow{flex:1;min-width:0}

.btn{border:0;background:var(--surface-2);border-radius:16px;padding:10px 16px;cursor:pointer;font-weight:700;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s, filter .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--hero-a) 35%,transparent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.icon-btn{border:0;background:none;padding:8px;border-radius:12px;cursor:pointer;color:var(--muted);min-width:40px;min-height:40px}
.scan-btn{flex:none;width:50px;min-height:50px;border-radius:16px;border:0;background:var(--surface);box-shadow:var(--shadow);color:var(--accent);display:grid;place-items:center;cursor:pointer}
.scan-btn svg{width:24px;height:24px}
.chip{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:99px;padding:8px 13px;font-size:.9rem;cursor:pointer;white-space:nowrap;font-weight:600}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px}
.chips .chip{box-shadow:none;background:var(--surface-2)}
.tag{font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:700;white-space:nowrap}
.tag.warn{background:color-mix(in srgb,var(--surplus) 16%,transparent);color:var(--surplus)}
.tag.plan{background:transparent;border:1px dashed var(--muted);color:var(--muted)}

input[type=text],input[type=number],input[type=email],input[type=password],input:not([type]),textarea,select{width:100%;border:1.5px solid transparent;background:var(--surface-2);border-radius:14px;padding:11px 14px;font-size:16px;min-height:46px;transition:border-color .2s, background .2s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);background:var(--surface)}
textarea{min-height:88px;resize:vertical}
label.field{display:flex;flex-direction:column;gap:5px;font-size:.84rem;color:var(--muted);font-weight:600}
label.field input,label.field select{color:var(--ink);font-weight:400}
.check{display:flex;gap:11px;align-items:flex-start;cursor:pointer}
.check input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent);flex:none}

.datenav{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:18px;padding:4px;box-shadow:var(--shadow)}
.datenav .d{flex:1;text-align:center}
.datenav .d b{font-family:var(--font-display);font-size:1.08rem;display:block;font-weight:700}

/* hero summary */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:18px;color:#fff;background:linear-gradient(140deg,var(--hero-a) 0%,var(--hero-b) 58%,var(--hero-c) 100%);box-shadow:0 14px 34px color-mix(in srgb,var(--hero-b) 35%,transparent);display:flex;flex-direction:column;gap:12px}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.10);pointer-events:none}
.hero::before{width:180px;height:180px;top:-70px;left:-50px}
.hero::after{width:120px;height:120px;bottom:-50px;right:30%}
.hero > *{position:relative}
.hero-top{display:flex;align-items:center;gap:16px}
.ring-wrap{position:relative;width:132px;height:132px;flex:none}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-center .big{font-family:var(--font-display);font-size:1.75rem;line-height:1;font-weight:800}
.ring-center .small{opacity:.85;font-size:.74rem;margin-top:4px;line-height:1.2}
.hero-side{flex:1;min-width:0;gap:7px}
.hero .op{opacity:.85}
.hero .mini{font-size:.84rem;background:rgba(255,255,255,.14);border-radius:14px;padding:8px 11px}
.balance{display:inline-flex;align-items:baseline;gap:6px;padding:5px 12px;border-radius:99px;font-weight:700;font-size:.95rem;align-self:flex-start;background:rgba(255,255,255,.2)}
.balance .dot{width:9px;height:9px;border-radius:50%;display:inline-block;box-shadow:0 0 0 2px rgba(255,255,255,.6)}
.deficit .dot{background:#5ff0c4} .surplus .dot{background:#ffb08f}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar > span{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .5s}
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.macro{display:flex;flex-direction:column;gap:4px}
.macro .k{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:5px;font-weight:600}
.macro .k i{width:9px;height:9px;border-radius:50%;display:inline-block}
.macro .v{font-weight:700;font-family:var(--font-display)}
.planned-note{font-size:.9rem}

.addbox .row input{flex:1;background:var(--surface);box-shadow:var(--shadow);min-height:50px;border-radius:16px}
.addbox .row .btn{min-height:50px}
.suggest{display:flex;flex-direction:column;margin-top:10px;border-radius:18px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.suggest:empty{display:none}
.suggest button{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px;cursor:pointer;min-height:50px}
.suggest button:last-child{border-bottom:0}
.suggest .ai{color:var(--accent);font-weight:700;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 7%,transparent),transparent)}
.sect-label{font-size:.76rem;color:var(--muted);margin:2px 0 6px;font-weight:700;letter-spacing:.02em}

.items{display:flex;flex-direction:column}
.item{display:flex;gap:10px;align-items:center;padding:12px 2px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:start;cursor:pointer}
.item:last-child{border-bottom:0}
.item.planned{opacity:.75}
.item.planned .nm{text-decoration:underline dashed var(--muted);text-underline-offset:3px}
.item .nm{font-weight:700}
.item .mac{font-size:.8rem;color:var(--muted)}
.item .kc{font-weight:800;white-space:nowrap;font-family:var(--font-display);background:var(--surface-2);border-radius:12px;padding:4px 10px;font-size:.92rem}
.empty{padding:18px 4px;text-align:center;color:var(--muted)}

.lockbar{display:flex;flex-direction:column;gap:10px}
.locked-banner{display:flex;gap:10px;align-items:center;background:var(--accent-soft);border-radius:18px;padding:12px 14px;font-size:.94rem}
.round-box{background:var(--surface);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)}

#sheet-wrap{position:fixed;inset:0;z-index:20;display:none}
#sheet-wrap.open{display:block}
#sheet-backdrop{position:absolute;inset:0;background:rgba(20,10,50,.45);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:8px 18px 24px;max-width:560px;margin:0 auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
#sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
#sheet .sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px}
#sheet .actions{display:flex;gap:8px;margin-top:16px}
#sheet .actions .btn{flex:1}
.name-input{font-family:var(--font-display);font-size:1.25rem;font-weight:800;border-color:transparent !important;background:transparent !important;padding-inline-start:0 !important}
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:3px;gap:2px}
.seg button{flex:1;white-space:nowrap;background:none;border:0;padding:8px 10px;cursor:pointer;font-size:.9rem;min-height:40px;border-radius:11px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--accent);font-weight:800;box-shadow:0 2px 8px rgba(60,35,140,.12)}
.qty-row{display:flex;gap:8px;align-items:center}
.qty-row input{flex:1;font-size:1.3rem;font-weight:700}
.qty-row .unit{min-width:70px;color:var(--muted)}
.preview{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:var(--surface-2);border-radius:18px;padding:12px 8px;text-align:center}
.preview b{display:block;font-size:1.08rem;font-family:var(--font-display);font-weight:800}
.preview div:first-child b{color:var(--accent)}
.preview span{font-size:.72rem;color:var(--muted)}
.comp{display:grid;grid-template-columns:1fr 84px 64px 32px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.comp input{min-height:38px;padding:6px 8px}
.comp .kc{text-align:end;font-size:.9rem}
.per100{grid-column:1/-1}
.per100 label{font-size:.72rem;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.per100 input{min-height:36px;padding:5px 6px}
.note{font-size:.88rem;color:var(--muted);background:var(--surface-2);border-radius:14px;padding:9px 12px}
.thinking{display:flex;align-items:center;gap:10px;padding:18px 0;color:var(--muted)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin,#sheet{animation:none}}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
.card .tile{background:var(--surface-2);box-shadow:none}
.tile b{display:block;font-family:var(--font-display);font-size:1.25rem;font-weight:800}
.tile span{font-size:.76rem;color:var(--muted)}
.tiles.kg b{font-size:1.05rem;white-space:nowrap}
.chart-wrap{position:relative;direction:ltr}
.chart-wrap svg{display:block;width:100%;height:auto;touch-action:pan-y}
.tooltip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.82rem;padding:6px 9px;border-radius:10px;white-space:nowrap;transform:translate(-50%,-100%);display:none;direction:rtl;text-align:right}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.legend i.line{height:2px;width:14px;background:var(--ink);vertical-align:3px}
.dayrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 2px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:start;cursor:pointer}
.dayrow:last-child{border-bottom:0}

.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:16px;font-size:.92rem;z-index:30;max-width:90%;box-shadow:0 10px 26px rgba(0,0,0,.25);font-weight:600}
.list-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-row .main{flex:1;min-width:0;background:none;border:0;text-align:start;cursor:pointer;padding:2px 0}
.star{color:var(--line);font-size:1.15rem} .star[aria-pressed="true"]{color:var(--carbs)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.hidden-file{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.photo-cta{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:18px;border-radius:20px;border:2px dashed color-mix(in srgb,var(--accent) 40%,transparent);background:var(--accent-soft);color:var(--accent);font-weight:800;cursor:pointer;width:100%}
.photo-cta svg{width:34px;height:34px}
.photo-cta span{font-weight:500;color:var(--muted);font-size:.86rem}
.code{font-family:ui-monospace,monospace;direction:ltr;unicode-bidi:isolate;letter-spacing:.04em}
@media (max-width:380px){ .macros{grid-template-columns:repeat(2,1fr)} .preview{grid-template-columns:repeat(3,1fr)} .ring-wrap{width:116px;height:116px} .ring-center .big{font-size:1.5rem} }
.auth{max-width:420px;margin:24px auto 0}
.auth h2{margin:0 0 4px}
.auth .seg{margin:6px 0 4px}
.auth input{width:100%}
.auth .err{color:var(--danger,#d33);font-size:.9rem;min-height:1.2em}
body.signed-out nav.tabs{display:none}
.scan-video{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:18px;background:#000}
.scan-frame{position:relative}
.scan-frame::after{content:"";position:absolute;inset:30% 12%;border:3px solid rgba(255,255,255,.85);border-radius:14px;pointer-events:none}
.adm-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:inherit;color:inherit;font:inherit}
.adm-table{width:100%;border-collapse:collapse;font-size:.9rem}
.adm-table th,.adm-table td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:start}
.tag{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--line);margin-inline-start:6px}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <h1><img class="logo" src="../icons/icon.svg" alt="" aria-hidden="true">מעקב כושר <span class="tag">בדיקה</span></h1>
    <span id="store-pill" class="store-pill"><i></i><span>טוען…</span></span>
  </header>
  <main id="view"><div class="empty">טוען את הנתונים שלך…</div></main>
</div>
<nav class="tabs" aria-label="אזורים"><div class="inner">
  <button data-act="tab" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>היום</button>
  <button data-act="tab" data-tab="saved"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1Z"/></svg>שמורים</button>
  <button data-act="tab" data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V4M4 20h16"/><path d="M8 14v3M12 10v7M16 12v5"/></svg>היסטוריה</button>
  <button data-act="tab" data-tab="admin" id="tab-admin" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.8-3 3-4.5 5.5-4.5s4.7 1.5 5.5 4.5"/><circle cx="17" cy="9" r="2.4"/><path d="M15.5 14.6c2.3.1 4 1.4 4.8 4.4"/></svg>מתאמנים</button>
  <button data-act="tab" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>הגדרות</button>
</div></nav>
<input type="file" id="lbl-file" class="hidden-file" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
<div id="sheet-wrap" aria-hidden="true"><div id="sheet-backdrop" data-act="close-sheet"></div><div id="sheet" role="dialog" aria-modal="true"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const BASIC = BASIC_RAW.map(([name, al, v, unitName, unitGrams, b], i) => ({
  id: "basic-" + i, kind: "basic", name, aliases: al ? al.split("|") : [],
  per100: {kcal:v[0], p:v[1], c:v[2], f:v[3], fib:v[4]},
  unitName: unitName || "", unitGrams: unitGrams || 0, basis: b === "u" && unitName ? "unit" : "g100"
}));

/* basic foods that a saved food of the same name doesn't override, best matches first */
function basicMatches(term, limit){
  if (!term) return [];
  const saved = new Set(Store.list("food").map(f => norm(f.name)));
  const out = [];
  BASIC.forEach(b => {
    if (saved.has(norm(b.name))) return;
    let best = 9;
    [b.name, ...b.aliases].forEach((n, j) => { n = norm(n);
      const s = n === term ? 0 : n.startsWith(term) ? 1 : n.includes(term) ? 2 : (term.length > 2 && term.includes(n)) ? 3 : 9;
      best = Math.min(best, s + (j ? 0.5 : 0)); });
    if (best < 9) out.push([best, b]);
  });
  return out.sort((a,b) => a[0] - b[0]).slice(0, limit).map(x => x[1]);
}
const basicById = id => BASIC.find(b => b.id === id);

/* ============ storage ============ */
const DEFAULTS = {maintenance:2000, calGoal:1700, proteinGoal:120, unsurePct:25, sheet:null, roundUp:false};
const S = { tab:"today", day:null, q:"", hist:30, sample:null, mcp:null, tabCache:{} };

const Store = {
  mode:"loading", coll:null, docs:{}, queues:{}, loaded:false, slow:false,
  async init(){
    this.mode = "cloud"; this.loaded = false; this.docs = {};
    const timer = setTimeout(() => { if (!this.confirmed) { this.slow = true; render(); } }, 10000);
    try {
      this.docs = await this.fetchAll();
      this.loaded = true; this.confirmed = true; this.slow = false; clearTimeout(timer);
      render(); setTimeout(autoLockCheck, 0);
    } catch (e) { clearTimeout(timer); this.loaded = true; this.error = "load"; this.slow = true; render(); toast("לא הצלחנו לטעון את הנתונים. בדוק את החיבור ורענן."); }
  },
  async fetchAll(){
    const out = {}; const step = 1000;
    for (let from = 0; ; from += step) {
      const { data, error } = await SB.from("docs").select("id,data").eq("user_id", Auth.user.id).range(from, from + step - 1);
      if (error) throw error;
      data.forEach(r => out[r.id] = r.data);
      if (data.length < step) break;
    }
    return out;
  },
  async refresh(){
    if (!this.loaded || !Auth.user || Object.values(this.queues).some(q => q.pending)) return;
    try { const d = await this.fetchAll(); if (Object.values(this.queues).some(q => q.pending)) return; this.docs = d; render(); setTimeout(autoLockCheck, 0); } catch (e) {}
  },
  get(id){ const d = this.docs[id]; return d ? structuredClone(d) : null; },
  list(kind){ return Object.entries(this.docs).filter(([,v]) => v.kind === kind).map(([id,v]) => ({id, ...v})); },
  put(id, data){ data = {...data, updatedAt: Date.now()}; this.docs = {...this.docs, [id]: data}; render();
    return this._write(id, async () => { const { error } = await SB.from("docs").upsert({user_id: Auth.user.id, id, data, updated_at: new Date().toISOString()}); if (error) throw error; }); },
  del(id){ const d = {...this.docs}; delete d[id]; this.docs = d; render();
    return this._write(id, async () => { const { error } = await SB.from("docs").delete().eq("user_id", Auth.user.id).eq("id", id); if (error) throw error; }); },
  _write(id, fn){
    if (this.mode !== "cloud") { try { localStorage.setItem("ct-data", JSON.stringify(this.docs)); } catch (e) {} return Promise.resolve(); }
    const q = (this.queues[id] || Promise.resolve()).then(fn).catch(e => {
      console.error(e); toast("השינוי לא נשמר. בדוק את החיבור ונסה שוב.");
    }).finally(() => { if (this.queues[id] === q) q.pending = false; });
    q.pending = true; this.queues[id] = q; return q;
  }
};
const settings = () => ({...DEFAULTS, ...(Store.docs.settings || {})});
const saveSettings = patch => Store.put("settings", {...settings(), ...patch});
/* Each day has its own lock time, in minutes after that day's midnight: 1440 = midnight (default), 1560 = 02:00 the next night. */
const DEFAULT_END = 1440;
const dayEndMin = d => +(d && d.endMin) || DEFAULT_END;
const dayEndTime = (k, d) => { const t = parseKey(k); t.setMinutes(dayEndMin(d)); return t.getTime(); };
const fmtEnd = min => { const h = Math.floor(min / 60) % 24, m = min % 60; const t = `${pad(h)}:${pad(m)}`; return min === 1440 ? "חצות" : min > 1440 ? `${t} בלילה` : t; };
const baseKey = () => keyOf(new Date());
/* "today" for logging: the previous day keeps going after midnight until its lock time (or while you reopened it), as long as the new day is still empty */
const todayKey = () => {
  const b = baseKey(), p = shiftKey(b, -1), pd = Store.docs["day-" + p], bd = Store.docs["day-" + b];
  if (pd && !pd.locked && !(bd && bd.items && bd.items.length)) {
    if (Date.now() < dayEndTime(p, pd)) return p;
    if (pd.autoLock === false && pd.unlockedAt && Date.now() - pd.unlockedAt < 6 * 3600e3) return p;
  }
  return b;
};
const getDay = k => Store.get("day-" + k) || {date:k, items:[], locked:false, timesLocked:0};
const saveDay = day => (!day.items.length && !day.timesLocked && !day.endMin && day.autoLock !== false) ? Store.del("day-" + day.date) : Store.put("day-" + day.date, day);
const allDays = () => Object.values(Store.docs).filter(v => v && v.date && Array.isArray(v.items));

function itemM(it){ let m = scaleM(it.per1, it.qty); if (it.unsure) m = unsureM(m, it.pct ?? settings().unsurePct); return m; }
/* a locked day may carry a conservative round-up (calories only, added at manual lock) */
const dayTotals = (day, withPlanned=false) => { const t = day.items.filter(i => withPlanned || !i.planned).reduce((a,i) => addM(a, itemM(i)), M0()); if (day.locked && +day.roundAdd > 0) t.kcal += +day.roundAdd; return t; };
/* next hundred above the day's calories; null when already round */
function roundInfo(kcal){ const from = Math.round(kcal || 0); if (from <= 0 || from % 100 === 0) return null; const to = Math.ceil(from / 100) * 100; return {from, to, add: to - kcal}; }
const dayMaint = day => (day.locked && day.snap) ? day.snap.maintenance : settings().maintenance;
function amountLabel(it){
  if (it.unitKey === "frac") return Math.abs(it.qty - 1) < 0.005 ? `כל ${it.fracOf || "המנה"}` : `${fmtFrac(it.qty)} מתוך ${it.fracOf || "המנה"}`;
  if (it.unitKey === "g") return `${g1(it.qty)} גרם`;
  if (it.unitKey === "ml") return `${g1(it.qty)} מ״ל`;
  return `${g1(it.qty)} ${it.unitLabel || ""}`.trim();
}
function recipeTotals(r){
  const total = (r.ingredients || []).reduce((a,ing) => addM(a, scaleM(ing.per100, (+ing.grams||0)/100)), M0());
  const raw = (r.ingredients || []).reduce((a,ing) => a + (+ing.grams||0), 0);
  const src = (+r.cookedWeight) ? "cooked" : (+r.estWeight) ? "est" : "raw";
  return {total, raw, src, weight: (+r.cookedWeight) || (+r.estWeight) || raw};
}
const macLine = m => `חלבון ${g1(m.p)} · פחמ׳ ${g1(m.c)} · שומן ${g1(m.f)} · סיבים ${g1(m.fib)}`;

/* --- suggestions --- */
const UNIT = "(kg|g|gr|grams?|ml|l|גרם|גר['׳]?|ג['׳]|ק[\"״']ג|קילו|מ[\"״']ל|מל|ליטר)";
const RE_A = new RegExp("^(\\d+(?:[.,]\\d+)?(?:\\s*/\\s*\\d+)?)\\s*" + UNIT + "?\\.?\\s+(?:of\\s+|של\\s+)?(.+)$", "i");
const RE_B = new RegExp("^(\\d+(?:[.,]\\d+)?)" + UNIT + "\\s*(?:of\\s+|של\\s+)?(.+)$", "i");
const RE_C = new RegExp("^(.+?)\\s+(\\d+(?:[.,]\\d+)?)\\s*" + UNIT + "$", "i");
function normUnit(u){
  u = (u || "").toLowerCase();
  if (!u) return "unit";
  if (u === "kg" || u.startsWith("ק")) return "kg";
  if (u === "l" || u === "ליטר") return "l";
  if (u === "ml" || u.startsWith("מ")) return "ml";
  return "g";
}
function parseAmount(q){
  q = q.trim();
  let m = q.match(RE_A) || q.match(RE_B);
  if (m) {
    let qty = parseNum(m[1]); let u = normUnit(m[2]);
    if (u === "kg") { qty *= 1000; u = "g"; } else if (u === "l") { qty *= 1000; u = "ml"; }
    return {qty, unit:u, name:m[3].trim()};
  }
  m = q.match(RE_C);
  if (m) { let qty = parseNum(m[2]); let u = normUnit(m[3]); if (u === "kg") { qty *= 1000; u = "g"; } else if (u === "l") { qty *= 1000; u = "ml"; } return {qty, unit:u, name:m[1].trim()}; }
  return {qty:null, unit:null, name:q};
}
const norm = s => String(s||"").toLowerCase().replace(/[֑-ׇ]/g, "").replace(/s\b/g, "").replace(/\s+/g, " ").trim();
function recents(){
  const seen = new Set(), out = [];
  allDays().flatMap(d => d.items.filter(i => !i.planned).map(i => ({...i, day:d.date}))).sort((a,b) => (b.t||0) - (a.t||0))
    .forEach(i => { const key = norm(i.name); if (!seen.has(key) && out.length < 8) { seen.add(key); out.push(i); } });
  return out;
}

}

/* least-squares line through (x, y) points; null with fewer than two distinct x */
function fitLine(points){
  if (points.length < 2) return null;
  const n = points.length, mx = points.reduce((a,p) => a + p[0], 0) / n, my = points.reduce((a,p) => a + p[1], 0) / n;
  const sxx = points.reduce((a,p) => a + (p[0]-mx)**2, 0); if (!sxx) return null;
  const b = points.reduce((a,p) => a + (p[0]-mx)*(p[1]-my), 0) / sxx;
  return {a: my - b*mx, b};
}

  const inRange = series.filter(x => x.date >= start && x.date <= tk);
  const avgBal = inRange.length ? inRange.reduce((a,x) => a + x.bal, 0) / inRange.length : 0;
  const totBal = inRange.reduce((a,x) => a + x.bal, 0);
  const days = allDays().filter(d => d.items.length).sort((a,b) => b.date.localeCompare(a.date));
  const fit = fitLine(inRange.map(x => [dayIndex(start, x.date), x.bal]));
  const perWeek = fit ? fit.b * 7 : 0;

  <div class="tiles">
    <div class="tile"><b class="num">${inRange.length ? signed(avgBal) : "–"}</b><span>ממוצע יומי</span></div>
    <div class="tile"><b class="num">${inRange.length ? signed(totBal) : "–"}</b><span>מאזן כולל</span></div>
    <div class="tile"><b class="num">${inRange.length}</b><span>ימים נעולים</span></div>
  </div>
  <section class="card stack" aria-label="גרף מאזן יומי">
    <div><h3>מאזן יומי מול קלוריות התחזוקה</h3><div class="muted small">מתחת לאפס זה גירעון. נספרים רק ימים נעולים; ימים שלא ננעלו חסרים בגרף.</div></div>
    <div class="chart-wrap" id="chart"><div class="tooltip" id="tip"></div></div>
    <div class="legend"><span><i style="background:var(--deficit)"></i>גירעון</span><span><i style="background:var(--surplus)"></i>עודף</span><span><i class="line"></i>ממוצע 7 ימים</span>${fit ? `<span><i class="line" style="background:none;border-top:2px dashed var(--accent);height:0"></i>קו מגמה</span>` : ""}</div>
    ${trendTxt ? `<div class="small">${trendTxt}</div>` : ""}
  </section>
  <section class="card stack" aria-label="שינוי משקל תאורטי">
    <h3>שינוי משקל תאורטי</h3>
    ${series.length ? `<div class="tiles kg">
      <div class="tile"><b class="num">${kgTxt(totBal / KCAL_PER_KG)}</b><span>ב־${S.hist} הימים האחרונים</span></div>
      <div class="tile"><b class="num">${kgTxt(allTot / KCAL_PER_KG)}</b><span>מאז היום הנעול הראשון</span></div>
      <div class="tile"><b class="num">${inRange.length ? kgTxt(avgBal * 30 / KCAL_PER_KG) : "–"}</b><span>בחודש, בקצב הנוכחי</span></div>
    </div>
    <div class="muted small">חישוב גס: כ־7,700 ${KCAL} גירעון ≈ ק״ג אחד של שומן. מים, מלח ופחמימות מזיזים את המשקל על המשקל ביום־יום הרבה יותר, אז השווה לממוצע של כמה שקילות. הדיוק תלוי גם בכמה מדויקות קלוריות התחזוקה שהגדרת.</div>`
    : `<div class="empty small">נעל ימים כדי לראות כמה משקל הגירעון שלך שווה, תאורטית.</div>`}

  <section class="card" aria-label="ימים">
    <h3>ימים</h3>
    ${days.length ? days.map(d => { const t = dayTotals(d); const b = t.kcal - dayMaint(d);
      return `<button class="dayrow" data-act="open-day" data-k="${esc(d.date)}"><div><b>${esc(niceDate(d.date))}</b><div class="muted small">${d.locked ? (+d.roundAdd > 0 ? "נעול · עוגל" : "נעול") : "לא נעול"} · חלבון ${g1(t.p)} גרם</div></div>
        <div style="text-align:end"><b class="num">${k0(t.kcal)} ${KCAL}</b><div class="small num" style="color:var(--${b <= 0 ? "deficit" : "surplus"})">${signed(b)}</div></div></button>`; }).join("")
      : `<div class="empty small">נעל את היום הראשון שלך כדי להתחיל את ההיסטוריה.</div>`}
  </section>`;
};

function drawChart(seriesIn){
  const wrap = $("#chart"); if (!wrap) return;
  const tk = todayKey(); const N = S.hist; const W = Math.max(280, wrap.clientWidth), H = 210;
  const padL = 48, padR = 8, padT = 12, padB = 24;
  const byDate = Object.fromEntries((seriesIn || lockedSeries()).map(x => [x.date, x]));
  const pts = []; for (let i = N - 1; i >= 0; i--) { const k = shiftKey(tk, -i); pts.push({k, v: byDate[k] ? byDate[k].bal : null, x: byDate[k]}); }
  pts.forEach((p, i) => { const win = pts.slice(Math.max(0, i - 6), i + 1).filter(q => q.v != null); p.ma = (p.v != null || win.length >= 2) && win.length ? win.reduce((a,q) => a + q.v, 0) / win.length : null; });
  const vals = pts.flatMap(p => [p.v, p.ma]).filter(v => v != null);
  let lo = Math.min(0, ...vals, -100), hi = Math.max(0, ...vals, 100);
  const step = (() => { const r = (hi - lo) / 4; const m = Math.pow(10, Math.floor(Math.log10(r))); return [1,2,2.5,5,10].map(s => s*m).find(s => s >= r); })();
  lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
  const y = v => padT + (hi - v) / (hi - lo) * (H - padT - padB);
  const bw = (W - padL - padR) / N; const x = i => padL + i * bw;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="מאזן קלורי יומי ב־${N} הימים האחרונים">`;
  for (let v = lo; v <= hi + 1e-6; v += step) {
    s += `<line x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--${v === 0 ? "muted" : "line"})" stroke-width="1" ${v === 0 ? "" : 'stroke-dasharray="2 3"'}/>`;
    s += `<text x="${padL - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${signedRaw(v)}</text>`;
  }
  const barW = Math.max(2, Math.min(18, bw - 2));
  pts.forEach((p, i) => { if (p.v == null) return;
    const y0 = y(0), y1 = y(p.v), top = Math.min(y0, y1), h = Math.max(1, Math.abs(y1 - y0)); const r = Math.min(4, barW/2, h);
    const cx = x(i) + (bw - barW) / 2;
    s += p.v <= 0
      ? `<path d="M${cx},${top} h${barW} v${h - r} q0,${r} -${r},${r} h-${barW - 2*r} q-${r},0 -${r},-${r} Z" fill="var(--deficit)"/>`
      : `<path d="M${cx},${top + h} v-${h - r} q0,-${r} ${r},-${r} h${barW - 2*r} q${r},0 ${r},${r} v${h - r} Z" fill="var(--surplus)"/>`;
  });
  const line = pts.map((p, i) => p.ma == null ? null : [x(i) + bw/2, y(p.ma)]);
  let d = "", pen = false; line.forEach(pt => { if (!pt) { pen = false; return; } d += (pen ? "L" : "M") + pt[0].toFixed(1) + "," + pt[1].toFixed(1); pen = true; });
  if (d) s += `<path d="${d}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const tf = fitLine(pts.map((p,i) => p.v == null ? null : [i, p.v]).filter(Boolean));
  const yc = v => Math.min(H - padB, Math.max(padT, y(v)));
  if (tf) { const vi = pts.map((p,i) => p.v == null ? -1 : i).filter(i => i >= 0); const i0 = vi[0], i1 = vi[vi.length-1];
    s += `<line x1="${x(i0) + bw/2}" y1="${yc(tf.a + tf.b*i0)}" x2="${x(i1) + bw/2}" y2="${yc(tf.a + tf.b*i1)}" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 4" stroke-linecap="round"/>`; }
  const lastI = line.map((p,i) => p ? i : -1).filter(i => i >= 0).pop();
  if (lastI != null) s += `<circle cx="${line[lastI][0]}" cy="${line[lastI][1]}" r="4" fill="var(--ink)" stroke="var(--surface)" stroke-width="2"/>`;
  [0, Math.floor((N-1)/2), N-1].forEach(i => { s += `<text x="${x(i) + bw/2}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === N-1 ? "end" : "middle"}" font-size="11" fill="var(--muted)">${esc(parseKey(pts[i].k).toLocaleDateString("he-IL",{day:"numeric",month:"numeric"}))}</text>`; });
  s += `</svg>`;
  wrap.insertAdjacentHTML("beforeend", s);
  if (!vals.length) wrap.insertAdjacentHTML("beforeend", `<div class="note" style="position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);direction:rtl">אין עדיין ימים נעולים בטווח הזה</div>`);
  const tip = $("#tip"), svg = wrap.querySelector("svg");
  const move = ev => {
    const r = svg.getBoundingClientRect(); const px = (ev.clientX - r.left) * W / r.width;
    const i = Math.floor((px - padL) / bw); const p = pts[i];
    if (!p || (p.v == null && p.ma == null)) { tip.style.display = "none"; return; }
    tip.innerHTML = `<b>${esc(niceDate(p.k))}</b><br>${p.v != null ? `${k0(p.x.kcal)} ${KCAL} · ${signed(p.v)}` : "לא נעול"}${p.ma != null ? `<br>ממוצע 7 ימים ${signed(p.ma)}` : ""}`;
    tip.style.display = "block";
    tip.style.left = Math.min(Math.max((x(i) + bw/2) * r.width / W, 70), r.width - 70) + "px";
    tip.style.top = (Math.min(y(p.v ?? p.ma), y(0)) * r.height / H - 6) + "px";
  };
  svg.addEventListener("pointermove", move); svg.addEventListener("pointerdown", move);
  svg.addEventListener("pointerleave", () => tip.style.display = "none");
}

/* ============ sheet (drawer) ============ */
let sheetCleanup = null;
function openSheet(html){
  const w = $("#sheet-wrap"); $("#sheet").innerHTML = `<div class="grab"></div>` + html;
  w.classList.add("open"); w.setAttribute("aria-hidden", "false");
}
function closeSheet(){
  const w = $("#sheet-wrap"); w.classList.remove("open"); w.setAttribute("aria-hidden", "true"); $("#sheet").innerHTML = "";
  if (sheetCleanup) { sheetCleanup(); sheetCleanup = null; }
}
function confirmBox(title, body, okLabel){
  return new Promise(res => {
    openSheet(`<div class="sheet-head"><h2>${esc(title)}</h2></div><p class="muted">${esc(body)}</p>
      <div class="actions"><button class="btn" id="cf-no">ביטול</button><button class="btn primary" id="cf-yes">${esc(okLabel)}</button></div>`);
    $("#cf-no").onclick = () => { sheetCleanup = null; closeSheet(); res(false); };
    $("#cf-yes").onclick = () => { sheetCleanup = null; closeSheet(); res(true); };
    sheetCleanup = () => res(false);
  });
}
const CLOSE_BTN = `<button class="icon-btn" data-act="close-sheet" aria-label="סגור">✕</button>`;

/* --- item sheet: add / edit / what-if --- */
let IS = null;
function openItemSheet(cfg){
  IS = {unsure:false, planned:false, ...cfg};
  IS.opt = IS.opt || IS.options[0].key;
  const s = settings();
  const opt = IS.options.find(o => o.key === IS.opt);
  if (IS.qty == null) IS.qty = opt.qty;
  const editing = IS.mode === "edit";
  openSheet(`
    <div class="sheet-head"><input id="is-name" class="name-input" type="text" value="${esc(IS.name)}" aria-label="שם">${CLOSE_BTN}</div>
    <div class="stack">
      ${IS.options.length > 1 ? `<div class="seg" role="group" aria-label="מדידה לפי">${IS.options.map(o => `<button data-act="is-opt" data-key="${o.key}" aria-pressed="${o.key === IS.opt}">${esc(o.tab)}</button>`).join("")}</div>` : ""}
      <div id="is-qtywrap"></div>
      ${!editing && IS.src && IS.src.type === "basic" ? `<div class="row between small"><span class="muted">ערכים סטנדרטיים מטבלאות תזונה, בלי Claude.</span><button class="chip" data-act="basic-edit">שנה ערכים ושמור אצלי</button></div>` : ""}
      <label class="check"><input type="checkbox" id="is-unsure" ${IS.unsure ? "checked" : ""}><span><b>לא בטוח / מסעדה</b><br><span class="muted small">מוסיף ${s.unsurePct}% לקלוריות (התוספת לשומן ולפחמימות, החלבון לא משתנה)</span></span></label>
      <div class="preview num" id="is-preview"></div>
    </div>
    <div class="actions">
      ${editing ? `<button class="btn danger" data-act="is-delete">הסר</button>` : `<button class="btn" data-act="is-save" data-planned="1">מה אם?</button>`}
      ${editing && IS.planned ? `<button class="btn" data-act="is-save" data-planned="0">אכלתי</button>` : ""}
      <button class="btn primary" data-act="is-save" data-planned="${editing ? (IS.planned ? 1 : 0) : 0}">${editing ? "שמור" : "הוסף ליום"}</button>
    </div>`);
  renderQty(); updatePreview();
}
function renderQty(){
  const opt = IS.options.find(o => o.key === IS.opt);
  $("#is-qtywrap").innerHTML = `
    <div class="qty-row"><input id="is-qty" type="text" inputmode="decimal" dir="ltr" value="${esc(opt.frac ? (IS.qtyText ?? fmtFracInput(IS.qty)) : g1(IS.qty))}" aria-label="כמות"><span class="unit">${esc(opt.label)}</span></div>
    ${opt.frac ? `<div class="chips" style="margin-top:8px">${[["¼",.25],["⅓",1/3],["½",.5],["¾",.75],["הכול",1]].map(([l,v]) => `<button class="chip" data-act="is-frac" data-v="${v}">${l}</button>`).join("")}</div>` : ""}
    ${opt.note ? `<div class="note" style="margin-top:8px">${esc(opt.note)}</div>` : ""}`;
}
const fmtFracInput = q => { const m = {0.25:"1/4",0.5:"1/2",0.75:"3/4",1:"1"}; for (const k in m) if (Math.abs(q - k) < 0.005) return m[k]; if (Math.abs(q - 1/3) < 0.005) return "1/3"; if (Math.abs(q-2/3) < .005) return "2/3"; return String(Math.round(q*1000)/1000); };
function previewCells(m){ return `<div><b>${k0(m.kcal)}</b><span>${KCAL}</span></div><div><b>${g1(m.p)}</b><span>חלבון</span></div><div><b>${g1(m.c)}</b><span>פחמימות</span></div><div><b>${g1(m.f)}</b><span>שומן</span></div><div><b>${g1(m.fib)}</b><span>סיבים</span></div>`; }
function updatePreview(){
  const opt = IS.options.find(o => o.key === IS.opt);
  const ok = isFinite(IS.qty) && IS.qty > 0;
  let m = ok ? scaleM(opt.per1, IS.qty) : M0();
  if (IS.unsure) m = unsureM(m, settings().unsurePct);
  $("#is-preview").innerHTML = previewCells(m);
  document.querySelectorAll('[data-act="is-save"]').forEach(b => b.disabled = !ok);
}
function saveItem(planned){
  const opt = IS.options.find(o => o.key === IS.opt);
  const k = IS.dayKey || S.day || todayKey(); const day = getDay(k);
  if (day.locked) { toast("היום הזה נעול. פתח אותו קודם."); return; }
  const it = {
    id: IS.itemId || rid(), name: ($("#is-name").value.trim() || IS.name), qty: IS.qty, unitKey: opt.key === "unit" ? "unit" : opt.key, unitLabel: opt.label, fracOf: opt.fracOf || null,
    per1: opt.per1, unsure: !!IS.unsure, pct: settings().unsurePct, planned: !!planned, src: IS.src || null, t: IS.t || Date.now(), components: IS.components || null
  };
  const i = day.items.findIndex(x => x.id === it.id);
  if (i >= 0) day.items[i] = it; else day.items.push(it);
  saveDay(day); closeSheet();
  if (IS.mode !== "edit") { S.q = ""; render(); }
  if (planned) toast("נוסף כ״מה אם״. כרטיס הסיכום מראה איפה תהיה.");
  else if (S.tab !== "today" && IS.mode !== "edit") toast(`נוסף ל${k === todayKey() ? "היום" : niceDate(k)}.`);
}

/* --- open item sheets from different sources --- */
function foodOptions(f){
  const per1 = scaleM(f.per100, 1/100);
  const o = [{key:"g", tab:"גרמים", label:"גרם", per1, qty:100}];
  if (f.unitName && +f.unitGrams > 0) o.push({key:"unit", tab:f.unitName, label:f.unitName, per1: scaleM(f.per100, f.unitGrams/100), qty:1});
  o.push({key:"ml", tab:"מ״ל", label:"מ״ל", per1, qty:100, note:"מ״ל נספר כגרם. זה קרוב מספיק לחלב, מיץ ורוב המשקאות."});
  return o;
}
function pickFood(id, pa){
  const f = Store.list("food").find(x => x.id === id); if (!f) return;
  const options = foodOptions(f); let opt = isUnitFood(f) ? "unit" : "g", qty;
  if (pa && pa.qty) { if (pa.unit === "ml") opt = "ml"; else if (pa.unit === "unit" && f.unitName) opt = "unit"; else if (pa.unit === "g") opt = "g"; qty = pa.unit === "unit" && !f.unitName ? undefined : pa.qty; }
  openItemSheet({mode:"add", name:f.name, options, opt, qty, src:{type:"food", id}});
}
function pickBasic(id, pa){
  const f = basicById(id); if (!f) return;
  const options = foodOptions(f); let opt = isUnitFood(f) ? "unit" : "g", qty;
  if (pa && pa.qty) { if (pa.unit === "ml") opt = "ml"; else if (pa.unit === "unit" && f.unitName) opt = "unit"; else if (pa.unit === "g") opt = "g"; qty = pa.unit === "unit" && !f.unitName ? undefined : pa.qty; }
  openItemSheet({mode:"add", name:f.name, options, opt, qty, src:{type:"basic", id}});
}
function editBasic(){
  const f = IS && IS.src && basicById(IS.src.id); if (!f) return;

/* --- AI estimate --- */
function aiError(e){
  const c = e && e.code;
  if (c === "not_granted" || c === "sampling_disabled" || c === "not_declared" || c === "capability_disabled") return "הערכות של Claude לא מאושרות לאפליקציה הזו כרגע. אשר אותן כש־Claude שואל, או הוסף את המזון ידנית בלשונית ״שמורים״.";
  if (c === "rate_limited") return "יותר מדי בקשות כרגע. נסה שוב בעוד דקה.";
  if (c === "daily_limit") return `הגעת למכסת ההערכות היומית${e.limit ? ` (${e.limit})` : ""}. המכסה מתחדשת בחצות. בינתיים אפשר לבחור מזון בסיסי או להוסיף ידנית.`;
  if (c === "global_limit" || c === "no_credit" || c === "not_configured") return "הערכות לא זמינות כרגע. אפשר לבחור מזון בסיסי או להוסיף מזון ידנית.";
  if (c === "invalid_json" || c === "empty_completion") return "לא הצלחנו לקרוא את התשובה של Claude. נסה שוב, או תאר את המזון קצת אחרת.";
  if (c === "refused") return "Claude לא הצליח להעריך את זה. נסה לתאר אחרת.";
  if (c === "session_expired") return "פג תוקף החיבור. התנתק והתחבר שוב.";
  return "ההערכה לא הגיעה. בדוק את החיבור ונסה שוב.";
}
let AI = null;
async function aiEstimate(q, opts = {}){
  if (!S.sample) { toast("הערכות של Claude עובדות רק כשהאפליקציה פתוחה ב־Claude."); return; }
  const ctl = new AbortController();
  AI = {q, ctl, comps:null, quick: !!opts.quick};
  openSheet(`<div class="sheet-head"><h2>מעריך את ״${esc(q)}״</h2>${CLOSE_BTN}</div>
    <div class="thinking"><span class="spin"></span><span>Claude מחשב קלוריות ומאקרו…</span></div>`);
  sheetCleanup = () => ctl.abort();
  const words = parseAmount(q).name.split(/\s+/).length;
  const prompt = `You are a careful nutrition estimator for a calorie-tracking app used in Israel. The user ate (the text may be in Hebrew): """${q}"""

Rules:
- Use typical average nutrition values (USDA-style, or Israeli product norms where relevant) per 100 g as eaten (cooked where relevant).
- If it's a restaurant dish, takeaway or a mixed meal (e.g. a burger with fries, shawarma in pita), break it into its main components (bun, patty, cheese, sauce, fries...). Include typical cooking oil, butter or tahini as its own component when it's usually there.
- If a total weight is given for a mixed dish, split it across components so the grams add up to that total.
- If an amount is in ml, convert to grams with the food's density. If a count is given (2 eggs, a slice), convert to grams using a typical size.
- If no amount is given, assume one typical portion.
- A single simple food (e.g. "50 גרם תפוח") is one component.
- Respect preparation details: skinless, drained, squeezed, peeled, trimmed of fat, deboned, fried, grilled, etc. Adjust the values to match (e.g. fish without skin uses skinless values).
- Countable pieces: if it is ONE simple food that is naturally counted in pieces (grape, egg, date, olive, cookie, slice of bread, pita, bar, cherry tomato, etc.), also return "unit": {"name": singular Hebrew name of one piece (e.g. "ענב"), "grams": typical weight of ONE piece as eaten, "count": how many pieces were eaten}. If no amount is given, count is 1. If a weight is given instead of a count, count = weight / piece grams. The single component's grams must equal count × unit grams. For mixed dishes, restaurant meals or foods not counted in pieces, "unit" is null.
- Write "name", every component "name", the unit "name" and "assumptions" in Hebrew. "name" is the food's name without the amount (e.g. "ענבים", not "10 ענבים").

Reply with only JSON in exactly this shape:
{"name":"שם קצר לתצוגה","restaurant":true or false (true if restaurant, takeaway, bakery or unknown-recipe food),"assumptions":"משפט קצר אחד על גודל המנה או כל הנחה אחרת","unit":{"name":"ענב","grams":5,"count":10} or null,"components":[{"name":"ענבים","grams":50,"per100":{"kcal":69,"protein":0.7,"carbs":18,"fat":0.2,"fiber":0.9}}]}`;
  try {
    const r = await S.sample.json(prompt, {modelTier: words <= 3 ? "quick" : "default", signal: ctl.signal});
    if (!AI || AI.ctl !== ctl) return;
    const comps = (Array.isArray(r && r.components) ? r.components : []).map(c => ({name:String(c.name || "פריט"), grams: Math.max(0, +c.grams || 0), per100: fromAI(c.per100)})).filter(c => c.grams > 0);
    if (!comps.length) throw {code:"invalid_json"};
    sheetCleanup = null;
    AI.comps = comps; AI.name = String(r.name || q); AI.assume = String(r.assumptions || ""); AI.unsure = !!r.restaurant; AI.saveFood = !opts.quick && comps.length === 1 && !r.restaurant;
    const u = r.unit && typeof r.unit === "object" ? r.unit : null;
    AI.unit = (u && comps.length === 1 && +u.grams > 0) ? {name: String(u.name || "יחידה"), grams: +u.grams, count: +u.count > 0 ? +u.count : Math.max(0.1, comps[0].grams / +u.grams)} : null;
    if (AI.unit) { const pa = parseAmount(q); AI.byUnit = !(pa.qty && (pa.unit === "g" || pa.unit === "ml")); AI.comps[0].grams = AI.unit.count * AI.unit.grams; }
    renderAIReview();

    if (e && e.code === "cancelled") return;

    sheetCleanup = null;
    $("#sheet").innerHTML = `<div class="grab"></div><div class="sheet-head"><h2>אין הערכה</h2>${CLOSE_BTN}</div><p class="muted">${esc(aiError(e))}</p>
      <div class="actions"><button class="btn" data-act="close-sheet">סגור</button><button class="btn primary" data-act="ai-retry">נסה שוב</button></div>`;
  }
}
function aiTotals(){ const m = AI.comps.reduce((a,c) => addM(a, scaleM(c.per100, c.grams/100)), M0()); return {m, grams: AI.comps.reduce((a,c) => a + c.grams, 0)}; }

async function lockCore(k, auto, roundAdd){
  const s = settings(); const day = getDay(k);

  await saveDay(day);

}
async function lockDay(){

    const ok = await confirmBox("להסיר את פריטי ה״מה אם״?", "פריטים מתוכננים שלא אכלת יוסרו כשהיום ננעל. אם אכלת חלק מהם, סמן אותם קודם ב״אכלתי״.", "הסר ונעל");

  const late = !S.day && k !== baseKey();
  const cb = $("#round-up"); const ri = roundInfo(dayTotals({...day, items: day.items.filter(i => !i.planned), locked:false}).kcal);
  await lockCore(k, false, cb && cb.checked && ri ? ri.add : 0);
  if (late) toast("היום ננעל. לילה טוב!");
}
function unlockDay(){
  const k = S.day || todayKey(); const day = getDay(k);

  if (k === shiftKey(baseKey(), -1) && !getDay(baseKey()).items.length) S.day = null;
  toast("היום נפתח. הנעילה האוטומטית שלו כבויה עכשיו, אז נעל אותו ידנית כשתסיים. השורה בגיליון תתעדכן.");
}
/* lock days whose lock time has passed; runs while the app is open and whenever it's opened */
let alBusy = false;
async function autoLockCheck(){
  if (alBusy || !Store.loaded || (Store.mode === "cloud" && !Store.confirmed)) return;
  alBusy = true;
  try {
    const now = Date.now(); const done = [];
    for (const d of allDays().sort((a,b) => a.date.localeCompare(b.date))) {
      if (d.locked || d.autoLock === false || !d.items.some(i => !i.planned)) continue;
      if (now >= dayEndTime(d.date, d)) { await lockCore(d.date, true); done.push(d.date); }
    }

  } finally { alBusy = false; }
}

function mcpMsg(e){
  const c = e && e.code;
  if (c === "needs_reauth") return "חבר מחדש את גוגל ב־claude.ai, בהגדרות ← מחברים.";
  if (c === "server_not_connected" || c === "selection_required") return "הוסף את המחברים Google Sheets ו־Google Drive ב־claude.ai, בהגדרות ← מחברים.";
  if (c === "not_in_manifest" || c === "approval_required" || c === "consent_required") return "אשר לאפליקציה להשתמש בגוגל כש־Claude שואל, ונסה שוב.";
  if (c === "blocked_by_policy") return "הארגון שלך חוסם את הפעולה הזו בגוגל.";
  if (c === "tool_error") return "גוגל החזיר שגיאה: " + String(e.message || "").slice(0, 140);
  if (c === "server_unavailable" || c === "upstream_error") return "גוגל לא הגיב. נסה שוב בעוד רגע.";
  if (c === "not_granted" || c === "capability_disabled") return "המחברים של גוגל עובדים רק כשהאפליקציה פתוחה ב־Claude.";
  return (e && e.message) ? String(e.message).slice(0, 140) : "משהו השתבש.";
}
async function call(server, tool, input){ const r = await S.mcp.callTool(server, tool, input, {cache:false}); return r && r.payload !== undefined ? r.payload : r; }
async function sheetTab(id){
  if (S.tabCache[id]) return S.tabCache[id];
  const p = await call("Google Sheets", "get_spreadsheet", {spreadsheetId:id, fields:["properties.title","sheets.properties.title"]});
  const t = p && p.sheets && p.sheets[0] && p.sheets[0].properties && p.sheets[0].properties.title;
  if (!t) throw {code:"tool_error", message:"לא הצלחנו לקרוא את הלשוניות של הגיליון."};
  S.tabCache[id] = {tab:t, title: p.properties && p.properties.title}; return S.tabCache[id];
}
const q1 = t => "'" + String(t).replace(/'/g, "''") + "'";
const HEAD = ["Date","Calories","Protein (g)","Carbs (g)","Fat (g)","Fiber (g)","Maintenance","Deficit / Surplus","Calorie goal","Protein goal","Locked at","Times locked","Rounding (kcal)"];
async function writeRow(sheetId, day){
  const {tab} = await sheetTab(sheetId);
  const got = await call("Google Sheets", "get_values", {spreadsheetId:sheetId, range:`${q1(tab)}!A:A`});
  const rows = (got && got.values) || [];
  await call("Google Sheets", "update_values", {spreadsheetId:sheetId, range:`${q1(tab)}!A1:M1`, values:[HEAD]});
  const idx = rows.findIndex((r, i) => i > 0 && r && r[0] === day.date);
  const n = idx >= 0 ? idx + 1 : Math.max(rows.length, 1) + 1;
  const t = dayTotals(day), m = day.snap ? day.snap.maintenance : settings().maintenance;
  const r1 = v => Math.round(v * 10) / 10;
  const row = [day.date, Math.round(t.kcal), r1(t.p), r1(t.c), r1(t.f), r1(t.fib), m, Math.round(t.kcal - m), day.snap ? day.snap.calGoal : "", day.snap ? day.snap.proteinGoal : "", new Date(day.lockedAt || Date.now()).toLocaleString("en-GB"), day.timesLocked || 1, Math.round(+day.roundAdd || 0)];
  await call("Google Sheets", "update_values", {spreadsheetId:sheetId, range:`${q1(tab)}!A${n}:M${n}`, values:[row]});
}
async function syncDay(k){
  const s = settings(); const day0 = getDay(k);
  if (!day0.locked) return;
  if (!s.sheet || !S.mcp) { const d = getDay(k); d.sheet = "off"; await saveDay(d); return; }
  try { await writeRow(s.sheet.id, day0); const d = getDay(k); d.sheet = "ok"; d.sheetErr = null; await saveDay(d); }
  catch (e) { const d = getDay(k); d.sheet = "error"; d.sheetErr = mcpMsg(e); await saveDay(d); }

function filesFrom(p){
  if (!p || typeof p !== "object") return [];
  if (Array.isArray(p)) return p.filter(x => x && typeof x === "object" && x.id);
  for (const k of ["files","items","results"]) if (Array.isArray(p[k])) return filesFrom(p[k]);
  if (p.id) return [p];
  for (const v of Object.values(p)) { const r = filesFrom(v); if (r.length) return r; }
  return [];
}

/* ============ nutrition-label photo ============
   The live camera is blocked inside the app, so the phone camera takes a photo of the nutrition table and Claude reads it. */
async function fileToCanvas(file, max){
  let bmp; try { bmp = await createImageBitmap(file, {imageOrientation:"from-image"}); } catch (e) { bmp = await createImageBitmap(file); }
  const sc = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height); return c;
}

- "per100": the values per 100 g (or per 100 ml, treated as 100 g) exactly as printed. null if the table has no per-100 column.
- "serving": if the label states a serving or a piece (e.g. "למנה", "לחטיף", "לפרוסה", "לגביע"), return {"name": Hebrew name of one serving or piece (e.g. "מנה", "חטיף", "פרוסה", "גביע"), "grams": its weight in grams or null if not printed, "values": the values per serving as printed, or null}. Otherwise null.

async function onLabelPhoto(file){

async function authSubmit(){
  if (AUTHV.busy) return;
  const m = AUTHV.mode, email = ($("#au-email") || {}).value, pass = ($("#au-pass") || {}).value;

/* Claude estimates through the server function (same interface the app used inside Claude) */
const blobToB64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(blob); });
async function callFn(body, signal){
  const { data } = await SB.auth.getSession();
  if (!data.session) throw {code:"session_expired"};
  let r;
  try {
    r = await fetch(SB_URL + "/functions/v1/estimate", {method:"POST", signal,
      headers: {"Content-Type":"application/json", "Authorization":"Bearer " + data.session.access_token, "apikey": SB_KEY}, body: JSON.stringify(body)});
  } catch (e) { if (e && e.name === "AbortError") throw {code:"cancelled"}; throw {code:"network"}; }
  let j = null; try { j = await r.json(); } catch (e) {}
  if (!j) throw {code:"upstream"};
  if (j.error) throw {code: j.error, limit: j.limit};
  return j.data;
}
const Claude = {
  async json(prompt, opts = {}){
    const images = opts.images ? await Promise.all(opts.images.map(blobToB64)) : undefined;
    return callFn({action:"estimate", prompt, tier: opts.modelTier, images}, opts.signal);
  },
  async limits(){ return {images: true}; }
};

let BC = {log:false, stream:null, timer:null};
function stopScan(){ if (BC.timer) clearInterval(BC.timer); BC.timer = null; if (BC.stream) BC.stream.getTracks().forEach(t => t.stop()); BC.stream = null; }
async function startBarcode(log){
  BC = {log, stream:null, timer:null};
  const live = "BarcodeDetector" in window && navigator.mediaDevices && navigator.mediaDevices.getUserMedia;
  openSheet(`<div class="sheet-head"><h2>סריקת ברקוד</h2>${CLOSE_BTN}</div>
    <div class="stack">
      ${live ? `<div class="scan-frame"><video id="bc-video" class="scan-video" playsinline muted></video></div><div class="muted small">כוון את המצלמה לברקוד שעל האריזה.</div>` : `<div class="note">הסריקה במצלמה עובדת ב־Chrome באנדרואיד. כאן אפשר להקליד את המספר שמתחת לברקוד.</div>`}
      <div class="row"><input id="bc-input" type="text" inputmode="numeric" dir="ltr" placeholder="או הקלד את מספר הברקוד" aria-label="מספר ברקוד"><button class="btn" data-act="bc-manual">חפש</button></div>
    </div>`);
  sheetCleanup = stopScan;
  if (!live) return;
  try {
    const det = new BarcodeDetector({formats: ["ean_13", "ean_8", "upc_a", "upc_e", "code_128"]});
    BC.stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: "environment"}, audio: false});
    const v = $("#bc-video"); if (!v) { stopScan(); return; }
    v.srcObject = BC.stream; await v.play();
    BC.timer = setInterval(async () => {
      if (!v.videoWidth) return;
      try { const codes = await det.detect(v); const c = codes && codes[0] && codes[0].rawValue;
        if (c && /^\d{6,14}$/.test(c)) { stopScan(); if (navigator.vibrate) navigator.vibrate(60); lookupBarcode(c, BC.log); } } catch (e) {}
    }, 250);
  } catch (e) {
    const f = $(".scan-frame"); if (f) f.outerHTML = `<div class="note">לא הצלחנו לפתוח את המצלמה. אשר גישה למצלמה בדפדפן, או הקלד את המספר.</div>`;
  }
}

    const st = {...DEFAULTS, ...(ADM.data.settings || {})};
    const days = Object.values(ADM.data).filter(d => d && d.date && d.items).sort((a, b) => b.date.localeCompare(a.date));
    const rows = days.slice(0, 30).map(d => { const t = dayTotals(d); const m = d.locked && d.snap ? d.snap.maintenance : st.maintenance; const g = d.locked && d.snap ? d.snap.calGoal : st.calGoal; return {d, t, m, g, bal: t.kcal - m}; });
    const series = adminSeries(); const tk = todayKey(); const start = shiftKey(tk, -(S.hist - 1));
    const inRange = series.filter(x => x.date >= start && x.date <= tk);
    const fit = fitLine(inRange.map(x => [dayIndex(start, x.date), x.bal])); const perWeek = fit ? fit.b * 7 : 0;
    const trendTxt = !fit ? "" : Math.abs(perWeek) < 25 ? "קו המגמה: המאזן היומי יציב בטווח הזה."
      : `קו המגמה: המאזן היומי ${perWeek < 0 ? "יורד" : "עולה"} בכ־${k0(Math.abs(perWeek))} ${KCAL} בכל שבוע (${perWeek < 0 ? "נוטה לגירעון גדול יותר" : "נוטה לכיוון עודף"}).`;
    const locked = rows.filter(r => r.d.locked); const last7 = locked.slice(0, 7);
    const avg = last7.length ? last7.reduce((a, r) => a + r.bal, 0) / last7.length : 0;
    const total = locked.reduce((a, r) => a + r.bal, 0);
    return head + `
      <section class="card stack" aria-label="ההגדרות של המתאמן">
        <h3>ההגדרות שלו</h3>
        <div class="grid2">
          <div><div class="muted small">קלוריות תחזוקה</div><b class="num">${k0(st.maintenance)} ${KCAL}</b></div>
          <div><div class="muted small">יעד קלוריות</div><b class="num">${k0(st.calGoal)} ${KCAL}</b></div>
          <div><div class="muted small">יעד חלבון</div><b class="num">${k0(st.proteinGoal)} גרם</b></div>
          <div><div class="muted small">תוספת ״לא בטוח״</div><b class="num">${k0(st.unsurePct)}%</b></div>
        </div>
        ${ADM.data.settings ? "" : `<div class="muted small">עוד לא שינה את ההגדרות, אלה ברירות המחדל.</div>`}
      </section>
      <section class="card stack" aria-label="גרף מאזן יומי">
        <div class="row between"><h3>מאזן יומי</h3><div class="seg" role="group" aria-label="טווח">${[14,30,90].map(n => `<button data-act="hist" data-n="${n}" aria-pressed="${S.hist === n}">${n} יום</button>`).join("")}</div></div>
        <div class="chart-wrap" id="chart"><div class="tooltip" id="tip"></div></div>
        <div class="legend"><span><i style="background:var(--deficit)"></i>גירעון</span><span><i style="background:var(--surplus)"></i>עודף</span><span><i class="line"></i>ממוצע 7 ימים</span>${fit ? `<span><i class="line" style="background:none;border-top:2px dashed var(--accent);height:0"></i>קו מגמה</span>` : ""}</div>
        ${trendTxt ? `<div class="small">${trendTxt}</div>` : `<div class="muted small">נספרים רק ימים נעולים. קו המגמה יופיע כשיהיו לפחות שני ימים נעולים בטווח.</div>`}
      </section>
      <section class="card stack"><div class="grid2">
        <div><div class="muted small">ממוצע מאזן 7 ימים נעולים</div><b class="num">${sgnK(avg)} ${KCAL}</b></div>
        <div><div class="muted small">שינוי משקל תאורטי (30 יום)</div><b class="num">${sgnG(total / KCAL_PER_KG)} ק״ג</b></div>
        <div><div class="muted small">ימים מתועדים</div><b class="num">${days.length}</b></div>
      </div></section>
      <section class="card"><table class="adm-table"><thead><tr><th>תאריך</th><th>${KCAL}</th><th>יעד</th><th>מאזן</th><th>חלבון</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td>${esc(r.d.date.slice(8, 10) + "." + r.d.date.slice(5, 7))}${r.d.locked ? "" : ' <span class="tag">פתוח</span>'}</td><td class="num">${k0(r.t.kcal)}</td><td class="num">${k0(r.g)}</td><td class="num">${sgnK(r.bal)}</td><td class="num">${g1(r.t.p)}</td></tr>`).join("") || `<tr><td colspan="5" class="muted">אין עדיין ימים מתועדים.</td></tr>`}
      </tbody></table></section>
      <div class="row"><button class="btn ghost" data-act="adm-test" data-id="${esc(u.id)}" data-v="${u.is_test ? 0 : 1}">${u.is_test ? "סמן כמשתמש אמיתי" : "סמן כמשתמש בדיקה"}</button></div>`;
  }
  const list = ADM.users.filter(u => u.id !== Auth.user.id && (ADM.showTest || !u.is_test));
  const testCount = ADM.users.filter(u => u.is_test).length;
  return `<h2>מתאמנים</h2>
    <section class="card stack" aria-label="הזמנת מתאמן">
      <h3>הזמנת מתאמן</h3>
      <div class="row"><input id="inv-email" type="email" dir="ltr" placeholder="email@example.com" aria-label="אימייל של המתאמן" value="${esc(ADM.invEmail || "")}"><button class="btn primary" style="white-space:nowrap" data-act="adm-invite" ${ADM.inviting ? "disabled" : ""}>שלח הזמנה</button></div>
      <div class="muted small">המתאמן יקבל אימייל עם קישור לאפליקציה, ויבחר סיסמה בכניסה הראשונה. רק מי שהוזמן יכול להיכנס.</div>
    </section>
    <section class="card">${list.map(u => `<button class="adm-row" data-act="adm-user" data-id="${esc(u.id)}"><span dir="auto">${esc(u.display_name || u.email)}${u.is_test ? '<span class="tag">בדיקה</span>' : ""}${u.role === "admin" ? '<span class="tag">מנהל</span>' : ""}</span><span class="muted small">הצטרף ${esc(new Date(u.created_at).toLocaleDateString("he-IL"))}</span></button>`).join("") || `<div class="muted">עוד אין מתאמנים. שלח להם את הקישור לאפליקציה כדי שיירשמו.</div>`}</section>
    ${testCount ? `<button class="btn ghost" data-act="adm-showtest">${ADM.showTest ? "הסתר" : "הצג"} משתמשי בדיקה (${testCount})</button>` : ""}`;
};

/* ============ events ============ */
const ACT = {
  "tab": el => { S.tab = el.dataset.tab; closeSheet(); render(); window.scrollTo(0, 0); },
  "day-shift": el => { const tk = todayKey(); const k = shiftKey(S.day || tk, +el.dataset.n); S.day = k >= tk ? null : k; S.q = ""; render(); },
  "open-day": el => { S.day = el.dataset.k === todayKey() ? null : el.dataset.k; S.tab = "today"; render(); window.scrollTo(0,0); },
  "q-go": () => goQuery(),
  "pick-food": el => pickFood(el.dataset.id, S.tab === "today" && S.q ? parseAmount(S.q) : null),
  "pick-recipe": el => pickRecipe(el.dataset.id, S.tab === "today" && S.q ? parseAmount(S.q) : null),
  "pick-basic": el => pickBasic(el.dataset.id, S.q ? parseAmount(S.q) : null),
  "basic-edit": () => editBasic(),
  "recent": el => reAdd(el.dataset.day, el.dataset.id),
  "ai-est": () => aiEstimate(S.q.trim()),
  "ai-retry": () => aiEstimate(AI ? AI.q : S.q.trim(), {quick: !!(AI && AI.quick)}),
  "ai-rm": el => { AI.comps.splice(+el.dataset.i, 1); if (!AI.comps.length) { closeSheet(); return; } renderAIReview(); },
  "ai-add": el => aiAdd(el.dataset.planned === "1"),
  "ai-by": el => { AI.name = ($("#ai-name").value.trim() || AI.name); AI.byUnit = el.dataset.u === "1"; if (AI.byUnit && AI.unit.grams > 0) AI.unit.count = Math.round(AI.comps[0].grams / AI.unit.grams * 10) / 10; AI.comps[0].grams = AI.unit.count * AI.unit.grams; renderAIReview(); },
  "item": el => editItem(el.dataset.id),
  "close-sheet": () => closeSheet(),
  "is-opt": el => { IS.opt = el.dataset.key; IS.qty = IS.options.find(o => o.key === IS.opt).qty; IS.qtyText = null; document.querySelectorAll('[data-act="is-opt"]').forEach(b => b.setAttribute("aria-pressed", b.dataset.key === IS.opt)); renderQty(); updatePreview(); },
  "is-frac": el => { IS.qty = +el.dataset.v; IS.qtyText = fmtFracInput(IS.qty); $("#is-qty").value = IS.qtyText; updatePreview(); },
  "is-save": el => saveItem(el.dataset.planned === "1"),
  "is-delete": () => { const day = getDay(IS.dayKey); day.items = day.items.filter(x => x.id !== IS.itemId); saveDay(day); closeSheet(); },
  "lock": () => lockDay(),
  "unlock": () => unlockDay(),
  "sync-day": () => { if (!settings().sheet) { S.tab = "settings"; render(); return; } const k = S.day || todayKey(); const d = getDay(k); d.sheet = "pending"; saveDay(d).then(() => syncDay(k)); },
  "fav": el => { const d = Store.get(el.dataset.id); if (d) Store.put(el.dataset.id, {...d, fav: !d.fav}); },
  "food-edit": el => openFoodEditor(el.dataset.id),
  "fe-save": el => saveFood(el.dataset.id || null, el.dataset.log === "1"),
  "fe-basis": el => { const nb = el.dataset.b, ug = parseNum($("#fe-unitGrams").value);
    if (FE.convert && nb !== FE.basis && ug > 0) { const f = nb === "unit" ? ug / 100 : 100 / ug; KEYS.forEach(k => { const inp = $("#fe-" + k); const v = parseNum(inp.value); if (isFinite(v)) inp.value = g1(v * f); }); }
    FE.basis = nb; document.querySelectorAll('[data-act="fe-basis"]').forEach(b => b.setAttribute("aria-pressed", b.dataset.b === FE.basis)); feHint(); },
  "fe-del": async el => { const id = el.dataset.id; const ok = await confirmBox("למחוק את המזון?", "ימים שכבר נרשמו שומרים על המספרים שלהם.", "מחק"); if (ok) Store.del(id); },
  "recipe-edit": el => openRecipeEditor(el.dataset.id),
  "saved-f": el => { S.savedF = el.dataset.f; render(); },
  "re-lookup": () => recipeLookup(),
  "re-blank": () => { syncRecipeFields(); RE.ingredients.push({name:"", grams:0, per100:M0(), open:true, manual:true}); renderRecipeEditor(); },
  "re-rm": el => { syncRecipeFields(); RE.ingredients.splice(+el.dataset.i, 1); renderRecipeEditor(); },
  "re-save": () => saveRecipe(),
  "re-del": async () => { const id = RE.id; const ok = await confirmBox("למחוק את המתכון?", "ימים שכבר נרשמו שומרים על המספרים שלהם.", "מחק"); if (ok) Store.del(id); },
  "hist": el => { S.hist = +el.dataset.n; render(); },
  "end-edit": () => openEndEditor(),
  "label": el => startLabel(el.dataset.log === "1", el.dataset.bc || ""),
  "barcode": el => startBarcode(el.dataset.log === "1"),
  "bc-manual": () => { const v = ($("#bc-input") || {}).value || ""; if (v.replace(/\D/g, "").length >= 6) { stopScan(); lookupBarcode(v.replace(/\D/g, ""), BC.log); } else toast("הקלד את המספר שמתחת לברקוד."); },
  "export": () => exportData(),
  "logout": () => Auth.signOut(),
  "auth-mode": el => { const em = $("#au-email"); if (em) AUTHV.email = em.value; AUTHV.mode = el.dataset.m; AUTHV.err = ""; renderAuth(); },
  "auth-go": () => authSubmit(),
  "adm-user": el => adminOpen(el.dataset.id),
  "adm-back": () => { ADM.sel = null; render(); },
  "adm-test": el => adminSetTest(el.dataset.id, el.dataset.v === "1"),
  "adm-invite": () => adminInvite(),
  "adm-showtest": () => { ADM.showTest = !ADM.showTest; render(); },
  "label-manual": () => openFoodEditor(null, {thenLog: LBL.log}),
  "end-save": () => saveEnd(),
  "sheet-find": () => sheetFind(),
  "sheet-create": () => sheetCreate(),
  "sheet-link": () => sheetLink(),
  "sheet-syncall": () => sheetSyncAll(),
  "sheet-off": async () => { const ok = await confirmBox("לנתק את הגיליון?", "הגיליון עצמו נשאר ב־Drive שלך. ימים שינעלו מעכשיו לא יועתקו אליו.", "נתק"); if (ok) saveSettings({sheet:null}); },
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
});
function goQuery(){
  const q = S.q.trim(); if (!q) { $("#q") && $("#q").focus(); return; }
  const pa = parseAmount(q); const term = norm(pa.name);
  const food = Store.list("food").find(f => norm(f.name) === term);
  const rec = Store.list("recipe").find(r => norm(r.name) === term);
  if (food) return pickFood(food.id, pa);
  if (rec) return pickRecipe(rec.id, pa);
  const basic = basicMatches(term, 1)[0];
  if (basic && [basic.name, ...basic.aliases].some(n => norm(n) === term)) return pickBasic(basic.id, pa);
  aiEstimate(q);
}
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "q") { S.q = t.value; const sg = $("#suggest"); if (sg) sg.innerHTML = suggestHTML(); }
  else if (t.id === "foodq") { S.foodQ = t.value; render(); }
  else if (t.id === "is-qty") { const opt = IS.options.find(o => o.key === IS.opt); IS.qty = parseNum(t.value); if (opt.frac) IS.qtyText = t.value; updatePreview(); }
  else if (t.id === "ai-count" || t.id === "ai-ugrams") { const v = Math.max(0, parseNum(t.value) || 0); if (t.id === "ai-count") AI.unit.count = v; else AI.unit.grams = v; AI.comps[0].grams = AI.unit.count * AI.unit.grams; updateAIPreview(); }
  else if (t.dataset.aiG != null) { AI.comps[+t.dataset.aiG].grams = Math.max(0, parseNum(t.value) || 0); updateAIPreview(); }
  else if (t.dataset.ingName != null) { RE.ingredients[+t.dataset.ingName].name = t.value; }
  else if (t.dataset.ingG != null) { RE.ingredients[+t.dataset.ingG].grams = Math.max(0, parseNum(t.value) || 0); updateRecipeTotals(); }
  else if (t.dataset.ingV != null) { RE.ingredients[+t.dataset.ingV].per100[t.dataset.k] = Math.max(0, parseNum(t.value) || 0); updateRecipeTotals(); }
  else if (t.id === "fe-unitGrams" || t.id === "fe-unitName") { feHint(); }
  else if (["re-units","re-cooked","re-unitName","re-text","re-name"].includes(t.id)) { syncRecipeFields(); updateRecipeTotals(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "is-unsure") { IS.unsure = t.checked; updatePreview(); }
  else if (t.id === "ai-unsure") { AI.unsure = t.checked; updateAIPreview(); }
  else if (t.id === "ai-save") { AI.saveFood = t.checked; }
  else if (t.id === "lbl-file" && t.files && t.files[0]) { onLabelPhoto(t.files[0]); }
  else if (t.id === "round-up") { saveSettings({roundUp: t.checked}); }
  else if (t.id && t.id.startsWith("set-")) {
    const key = t.id.slice(4); const v = parseNum(t.value);
    if (!isFinite(v) || v < 0) { toast("הכנס מספר."); render(); return; }
    saveSettings({[key]: Math.round(v)}); toast("נשמר.");
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.id === "q") { e.preventDefault(); goQuery(); }
  if (e.key === "Enter" && e.target.closest && e.target.closest(".auth")) { e.preventDefault(); authSubmit(); }
  if (e.key === "Escape" && $("#sheet-wrap").classList.contains("open")) closeSheet();
});
let rT; window.addEventListener("resize", () => { clearTimeout(rT); rT = setTimeout(() => { if (S.tab === "history") render(); }, 150); });

Auth.start();
</script>
</body>
</html>
